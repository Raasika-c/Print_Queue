[appservers]
# Local deployment target for lab demonstrations
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3

# Production / Staging servers (uncomment and configure for remote deployments)
# prod-node1 ansible_host=192.168.1.50 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa
# prod-node2 ansible_host=192.168.1.51 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

[webservers]
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3

[dbservers]
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3

[all:vars]
app_name=digital-print-queue
app_port=8080
web_port=80
mysql_port=3306
app_env=production
deploy_dir=/opt/digital-print-queue
upload_dir=/opt/digital-print-queue/uploads
jwt_secret=ProductionSecretKey2026DigitalPrintQueueManagementSystem23IT723Lab
jwt_expiry_ms=86400000
