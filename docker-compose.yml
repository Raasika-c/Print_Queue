version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # MySQL Database Microservice
  # ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: dpq-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: digital_print_queue
      MYSQL_USER: printuser
      MYSQL_PASSWORD: printpass
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - printqueue_mysql_data:/var/lib/mysql
    networks:
      - printqueue_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "printuser", "-pprintpass"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ----------------------------------------------------------------------------
  # Spring Boot Application Microservice
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: digital-print-queue:latest
    container_name: dpq-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: digital_print_queue
      DB_USER: printuser
      DB_PASSWORD: printpass
      JWT_SECRET: ProductionGradeSecretKey2026DigitalPrintQueueManagementSystem23IT723Lab
      JWT_EXPIRY_MS: 86400000
    volumes:
      # Uploaded documents persistent storage — persists across container destruction/recreation
      - printqueue_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - printqueue_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s

# ------------------------------------------------------------------------------
# Persistent Volume Declarations
# ------------------------------------------------------------------------------
volumes:
  printqueue_uploads:
    name: printqueue_uploads
    driver: local
  printqueue_mysql_data:
    name: printqueue_mysql_data
    driver: local

# ------------------------------------------------------------------------------
# Bridge Network Definition
# ------------------------------------------------------------------------------
networks:
  printqueue_network:
    name: printqueue_network
    driver: bridge
