# =============================================================
# Test application properties — uses H2 in-memory database.
# Active automatically for all tests in src/test/.
# =============================================================

# H2 In-Memory Database (MySQL compatibility mode)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA — create schema from entities during tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Disable Flyway for tests (we use create-drop instead)
spring.flyway.enabled=false

# JWT test configuration
app.jwt.secret=TestSecretKey2026DigitalPrintQueueManagementSystem23IT723Lab
app.jwt.expiry-ms=3600000

# File upload test config
app.file.upload-dir=./test-uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Scheduler — use poolSize=1 (required), but very long interval to prevent firing during tests
spring.task.scheduling.pool.size=1

# Printer settings
app.printer.processing-seconds-per-page=1
app.printer.count=3
app.scheduler.interval-ms=999999999

# Logging — quieter during tests
logging.level.com.printqueue=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
