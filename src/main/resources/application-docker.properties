# =============================================================
# application-docker.properties — Docker environment overrides
# Used when SPRING_PROFILES_ACTIVE=docker
# =============================================================

# Docker MySQL service name as host
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:printqueue_db}?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true

# Slightly larger pool for container environment
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.connection-timeout=60000

# Show less output in container logs
spring.jpa.show-sql=false
logging.level.com.printqueue=INFO

# File storage inside container
app.file.upload-dir=/app/uploads
