# =============================================================
# Digital Printing Queue Management System
# application.properties — main configuration
# Course: 23IT723 DevOps Laboratory
# =============================================================

# ---- Server ----
server.port=${APP_PORT:8080}

# ---- DataSource (MySQL) ----
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:printqueue_db}?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:printqueue_user}
spring.datasource.password=${DB_PASSWORD:printqueue_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- Flyway ----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ---- JWT ----
app.jwt.secret=${JWT_SECRET:DigitalPrintQueueSecretKey2026AcademicDevOpsLab23IT723JNTU}
app.jwt.expiry-ms=${JWT_EXPIRY_MS:86400000}

# ---- File Upload ----
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
app.file.upload-dir=${FILE_UPLOAD_DIR:./uploads}

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.app.name=Digital Printing Queue Management System
management.info.app.version=1.0.0
management.info.app.course=23IT723 DevOps Laboratory

# ---- Logging ----
logging.level.com.printqueue=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ---- SpringDoc OpenAPI ----
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ---- Printer Scheduler ----
app.scheduler.interval-ms=${SCHEDULER_INTERVAL_MS:2000}
app.printer.processing-seconds-per-page=${PROCESSING_SECONDS_PER_PAGE:1}
app.printer.count=${PRINTER_COUNT:3}
