<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Digital Print Queue</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/index.html">
                <i class="bi bi-printer-fill me-2 text-primary"></i>Digital Print<span>Queue</span>
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/register.html">Sign Up</a>
            </div>
        </div>
    </nav>

    <main class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="d-inline-flex p-3 rounded-circle bg-primary-subtle text-primary mb-2">
                            <i class="bi bi-box-arrow-in-right fs-2"></i>
                        </div>
                        <h2 class="fw-bold">Sign In</h2>
                        <p class="text-muted small">Access your print queue dashboard</p>
                    </div>

                    <div id="login-alert" class="alert alert-danger d-none" role="alert"></div>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" class="form-control" id="email" required placeholder="user@example.com" autocomplete="email">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" required placeholder="••••••••" autocomplete="current-password">
                        </div>
                        <button type="submit" id="loginBtn" class="btn btn-primary w-100 py-2 fw-semibold">
                            <span id="loginSpinner" class="spinner-border spinner-border-sm me-1 d-none"></span>
                            Sign In
                        </button>
                    </form>

                    <div class="mt-4 pt-3 border-top text-center small text-muted">
                        Don't have an account? <a href="/register.html" class="text-primary text-decoration-none fw-semibold">Create one</a>
                    </div>

                    <div class="mt-4 p-3 bg-light rounded border">
                        <div class="fw-bold small text-secondary mb-1"><i class="bi bi-info-circle me-1"></i>Demo Admin Credentials:</div>
                        <div class="d-flex justify-content-between align-items-center small">
                            <code>admin@digitalprint.com</code> / <code>Admin@123</code>
                            <button type="button" class="btn btn-sm btn-outline-secondary py-0 px-2" onclick="fillDemoAdmin()">Auto-fill</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
    <script>
        function fillDemoAdmin() {
            document.getElementById('email').value = 'admin@digitalprint.com';
            document.getElementById('password').value = 'Admin@123';
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const alertEl = document.getElementById('login-alert');
            const btn = document.getElementById('loginBtn');
            const spinner = document.getElementById('loginSpinner');

            alertEl.classList.add('d-none');
            btn.disabled = true;
            spinner.classList.remove('d-none');

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.message || 'Invalid credentials');
                }

                setAuth(data.token, {
                    id: data.userId,
                    name: data.name,
                    email: data.email,
                    role: data.role
                });

                showToast('Welcome back, ' + data.name + '!', 'success');

                const params = new URLSearchParams(window.location.search);
                const redirect = params.get('redirect');

                setTimeout(() => {
                    if (redirect) {
                        window.location.href = redirect;
                    } else if (data.role === 'ADMIN') {
                        window.location.href = '/admin-dashboard.html';
                    } else {
                        window.location.href = '/dashboard.html';
                    }
                }, 400);

            } catch (err) {
                alertEl.innerText = err.message;
                alertEl.classList.remove('d-none');
            } finally {
                btn.disabled = false;
                spinner.classList.add('d-none');
            }
        });
    </script>
</body>
</html>
