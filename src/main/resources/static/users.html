<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Directory - Digital Print Queue</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/index.html">
                <i class="bi bi-shield-lock-fill me-2 text-danger"></i>Digital Print<span>Admin</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/admin-dashboard.html">Overview</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin-queue.html">Queue Management</a></li>
                    <li class="nav-item"><a class="nav-link" href="/printer.html">Virtual Printer</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/users.html">User Directory</a></li>
                    <li class="nav-item"><a class="nav-link" href="/queue.html">Public Queue</a></li>
                </ul>
                <ul class="navbar-nav" id="nav-auth-section"></ul>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h2 class="fw-bold mb-1"><i class="bi bi-people me-2 text-primary"></i>User Directory</h2>
                <p class="text-muted mb-0">List of all registered system accounts and permissions</p>
            </div>
            <div>
                <span class="badge bg-secondary fs-6 px-3 py-2" id="userCountBadge">0 Users Total</span>
            </div>
        </div>

        <div class="card p-3 mb-4">
            <div class="row g-3 align-items-center">
                <div class="col-md-5">
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                        <input type="text" id="userSearch" class="form-control" placeholder="Search user by name, email, or mobile...">
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Full Name</th>
                            <th>Email Address</th>
                            <th>Mobile</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th>Registered Date</th>
                        </tr>
                    </thead>
                    <tbody id="users-tbody">
                        <tr>
                            <td colspan="7" class="text-center py-5 text-muted">
                                <div class="spinner-border spinner-border-sm text-primary me-2"></div> Loading users...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
    <script>
        requireAuth(true); // Admin only

        let allUsers = [];

        async function loadUsers() {
            try {
                allUsers = await apiFetch('/admin/users');
                document.getElementById('userCountBadge').innerText = `${allUsers.length} Users Total`;
                renderUsers();
            } catch (err) {
                document.getElementById('users-tbody').innerHTML = `
                    <tr><td colspan="7" class="text-center text-danger py-4">${err.message}</td></tr>
                `;
            }
        }

        function renderUsers() {
            const query = document.getElementById('userSearch').value.toLowerCase().trim();

            const filtered = allUsers.filter(u => {
                return !query || 
                    u.name.toLowerCase().includes(query) || 
                    u.email.toLowerCase().includes(query) || 
                    (u.mobile && u.mobile.includes(query));
            });

            const tbody = document.getElementById('users-tbody');
            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center py-5 text-muted">No users found.</td></tr>';
                return;
            }

            tbody.innerHTML = filtered.map(u => `
                <tr>
                    <td class="fw-bold">#${u.id}</td>
                    <td>
                        <div class="fw-semibold">${u.name}</div>
                    </td>
                    <td>${u.email}</td>
                    <td>${u.mobile || '<span class="text-muted">—</span>'}</td>
                    <td>
                        <span class="badge ${u.role === 'ADMIN' ? 'bg-danger' : 'bg-primary'}">
                            ${u.role}
                        </span>
                    </td>
                    <td>
                        <span class="badge ${u.status === 'ACTIVE' ? 'bg-success' : 'bg-secondary'}">
                            ${u.status}
                        </span>
                    </td>
                    <td class="small text-muted">${formatDate(u.createdAt)}</td>
                </tr>
            `).join('');
        }

        document.getElementById('userSearch').addEventListener('input', renderUsers);
        document.addEventListener('DOMContentLoaded', loadUsers);
    </script>
</body>
</html>
