<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Digital Print Queue</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/index.html">
                <i class="bi bi-printer-fill me-2 text-primary"></i>Digital Print<span>Queue</span>
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/index.html">Home</a>
            </div>
        </div>
    </nav>

    <main class="container my-auto py-5 text-center">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <div class="card shadow-sm p-5">
                    <div class="text-danger mb-3">
                        <i class="bi bi-exclamation-triangle-fill display-1"></i>
                    </div>
                    <h1 class="fw-bold mb-2" id="error-title">Oops! Something went wrong</h1>
                    <p class="text-muted mb-4" id="error-desc">
                        The resource or action you requested could not be completed.
                    </p>
                    <div class="d-flex justify-content-center gap-2">
                        <a href="/index.html" class="btn btn-primary px-4">
                            <i class="bi bi-house me-1"></i> Return Home
                        </a>
                        <a href="/dashboard.html" class="btn btn-outline-secondary px-4">
                            <i class="bi bi-speedometer2 me-1"></i> Dashboard
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const msg = params.get('msg');

        if (code) {
            document.getElementById('error-title').innerText = `Error ${code}`;
        }
        if (msg) {
            document.getElementById('error-desc').innerText = decodeURIComponent(msg);
        }
    </script>
</body>
</html>
